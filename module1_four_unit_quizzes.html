const units=[{"title": "Unit 1 – Basic Mud & Mud Logging", "questions": [{"n": 1, "q": "Which of the following best describes the two primary functions of drilling fluid?", "opts": ["Cooling the bit and lubricating tubulars only", "Transporting cuttings/gas and controlling subsurface pressures", "Generating electrical signals and cleaning the rig floor", "Powering the mud pumps and rotating the drill string"], "answer": "B"}, {"n": 2, "q": "In a typical water-based mud composition, water represents approximately what percentage of the total volume?", "opts": ["30%", "50%", "80%", "95%"], "answer": "C"}, {"n": 3, "q": "Which drilling fluid type is preferred for drilling highly reactive shale formations and high-temperature wells due to its thermal stability and inhibitive properties?", "opts": ["Water-based mud", "Oil-based mud", "Foam", "Air mist"], "answer": "B"}, {"n": 4, "q": "Gaseous (pneumatic) drilling fluids require which surface equipment that is NOT typically used with conventional liquid mud systems?", "opts": ["Mud pump and shale shaker", "Rotating head and blooey line", "Centrifuge and degasser", "Mud cleaner and desander"], "answer": "B"}, {"n": 5, "q": "Which drilling fluid is specifically designed to minimize formation damage when drilling through the pay zone?", "opts": ["Spud mud", "Drill-in fluid", "Kill mud", "Spacer fluid"], "answer": "B"}, {"n": 6, "q": "After the last casing string is cemented, the mud in the well is replaced by which fluid to protect tubulars and the formation?", "opts": ["Completion fluid", "Drill-in fluid", "Loss circulation pill", "Cement slurry"], "answer": "A"}, {"n": 7, "q": "The main purpose of controlling drilling fluid density is to:", "opts": ["Increase rate of penetration", "Control hydrostatic pressure and prevent well control issues", "Reduce mud cost", "Improve cuttings color"], "answer": "B"}, {"n": 8, "q": "Which instrument is used to measure mud density under elevated pressure to account for compressibility and trapped air?", "opts": ["Marsh funnel", "Pressurized mud balance", "Retort", "Fann VG meter"], "answer": "B"}, {"n": 9, "q": "A mud weight that is too low compared to formation pressure may result in:", "opts": ["Differential sticking", "Lost circulation", "Formation influx (kick)", "Excessive ECD"], "answer": "C"}, {"n": 10, "q": "Maintaining the correct pH of a water-based mud is essential primarily for:", "opts": ["Fluid stability, minimizing corrosion, and additive effectiveness", "Increasing mud density", "Reducing the lag time", "Detecting hydrocarbon shows"], "answer": "A"}, {"n": 11, "q": "Rheology is best defined as the study of:", "opts": ["Rock mechanics under pressure", "Flow and deformation of fluids under applied forces", "Heat transfer in drilling fluids", "Electrical conductivity of muds"], "answer": "B"}, {"n": 12, "q": "Which of the following statements about Newtonian fluids is correct?", "opts": ["Their viscosity changes with shear rate", "Their viscosity remains constant regardless of shear rate", "They always contain solid particles", "All drilling fluids are Newtonian"], "answer": "B"}, {"n": 13, "q": "Yield Point (YP) primarily indicates the mud's:", "opts": ["Static suspension capability", "Resistance to flow under stress and dynamic carrying capacity", "Compressibility under pressure", "Electrical breakdown voltage"], "answer": "B"}, {"n": 14, "q": "Gel strength is a measurement of the mud's ability to:", "opts": ["Carry cuttings at high shear rates", "Suspend solids when the fluid is static", "Form an impermeable filter cake", "Resist thermal degradation"], "answer": "B"}, {"n": 15, "q": "The Marsh funnel is used at the rig site to provide a routine measurement of:", "opts": ["Plastic viscosity", "Funnel (apparent) viscosity", "Yield point", "Gel strength"], "answer": "B"}, {"n": 16, "q": "An ideal filter cake formed by drilling fluid against the wellbore should be:", "opts": ["Thick and permeable", "Thin and impermeable", "Thick and impermeable", "Thin and permeable"], "answer": "B"}, {"n": 17, "q": "The standard API filter press operates at what pressure to measure fluid loss?", "opts": ["50 psi", "100 psi", "300 psi", "500 psi"], "answer": "B"}, {"n": 18, "q": "The HTHP filter press is designed to evaluate filtration properties at conditions of approximately:", "opts": ["100 psi and ambient temperature", "500 psi and 300°F", "1,000 psi and 500°F", "100 psi and 200°F"], "answer": "B"}, {"n": 19, "q": "The Permeability Plugging Test (PPT) is used primarily to evaluate the fluid's ability to:", "opts": ["Suspend barite when static", "Seal off depleted or under-pressured permeable intervals", "Resist bacterial contamination", "Withstand electrical breakdown"], "answer": "B"}, {"n": 20, "q": "The Electrical Stability (ES) test is performed specifically on which drilling fluid type?", "opts": ["Water-based mud", "Oil-based / synthetic-based mud", "Gaseous drilling fluid", "Brine completion fluid"], "answer": "B"}, {"n": 21, "q": "The ES test is performed by inserting the probe into a mud sample heated to approximately:", "opts": ["80°F", "120°F", "200°F", "300°F"], "answer": "B"}, {"n": 22, "q": "A higher Electrical Stability voltage value generally indicates that the oil-based mud emulsion is:", "opts": ["Weak and likely to break", "Stable and well emulsified", "Contaminated with gas", "Excessively diluted with water"], "answer": "B"}, {"n": 23, "q": "In a retort test, the total cup volume is 50 mL, water reads 8 mL and oil reads 30 mL. What is the solids content (by volume)?", "opts": ["12%", "16%", "24%", "38%"], "answer": "C"}, {"n": 24, "q": "The sand content test for drilling mud is performed by:", "opts": ["Heating the sample in a retort", "Sieve analysis and expressing the result as percentage by volume", "Measuring electrical resistance", "Filtering through API filter paper at 100 psi"], "answer": "B"}, {"n": 25, "q": "Which combination of materials is commonly used to formulate loss-of-circulation pills?", "opts": ["High-viscosity pills, calcium carbonate, and sized salt", "Barite, hematite, and ilmenite", "Sodium chloride, KCl, and caustic soda", "Diesel, base oil, and emulsifier"], "answer": "A"}, {"n": 26, "q": "Completion fluids are designed to achieve all of the following EXCEPT:", "opts": ["Control formation pressure", "Minimize formation damage", "Maintain tubulars integrity", "Maximize rate of penetration"], "answer": "D"}, {"n": 27, "q": "Mud logging is best defined as:", "opts": ["Logging the chemical additives used in the mud system", "Real-time analysis of drilling fluid and rock cuttings during drilling", "Recording the mud engineer's daily report", "Wireline logging of the open hole after drilling"], "answer": "B"}, {"n": 28, "q": "Which of the following is NOT a typical responsibility of the mud logging unit?", "opts": ["Detecting hazardous gases such as H2S", "Monitoring trip volumes and drilling parameters", "Operating the blowout preventer (BOP)", "Generating mud logs and the final well report"], "answer": "C"}, {"n": 29, "q": "The mud logging unit is typically located:", "opts": ["Inside the doghouse with the driller", "Very close to the rig floor with cables running to sensors", "At the company office offsite", "On top of the derrick"], "answer": "B"}, {"n": 30, "q": "Mud logging operations at the rig site typically run on what schedule?", "opts": ["8 hours per day, 5 days per week", "12 hours per day during daylight only", "24 hours per day, 7 days per week", "Only during connections and trips"], "answer": "C"}, {"n": 31, "q": "Lag time is best described as the time necessary for:", "opts": ["The drill bit to penetrate one foot of formation", "Drilled cuttings to travel from the bit to the surface", "The mud engineer to perform a mud check", "The shale shaker to clean the cuttings"], "answer": "B"}, {"n": 32, "q": "The term that describes the surface-to-surface mud travel time is:", "opts": ["Lag down", "Lag up", "Complete cycle (in/out time)", "Bottoms up"], "answer": "C"}, {"n": 33, "q": "For two wells with the same pump rate and casing ID but different drill pipe ODs, which case produces a higher lag time?", "opts": ["The one with the larger drill pipe OD (smaller annular volume)", "The one with the smaller drill pipe OD (larger annular volume)", "Both produce identical lag times", "Drill pipe OD has no influence on lag time"], "answer": "B"}, {"n": 34, "q": "During a carbide lag check, the reaction that produces the detectable gas is:", "opts": ["Water + carbide produces methane", "Water + carbide produces acetylene", "Oil + carbide produces hydrogen sulfide", "Air + carbide produces carbon dioxide"], "answer": "B"}, {"n": 35, "q": "Why can calcium carbide NOT be used for a lag check in oil-based mud?", "opts": ["The carbide is too dense for OBM", "There is insufficient free water in OBM to react with the carbide and produce acetylene", "OBM destroys the gas chromatograph", "Carbide is flammable in oil environments"], "answer": "B"}, {"n": 36, "q": "During trip-in operations, the main well control risk that mud loggers must monitor is:", "opts": ["Swab effect", "Surge effect", "Lost circulation only", "Gas migration only"], "answer": "B"}, {"n": 37, "q": "During trip-out operations, the main well control risk is:", "opts": ["Surge effect", "Swab effect", "Bit balling", "Overpull on connection"], "answer": "B"}, {"n": 38, "q": "A wet trip-out (closed-end string) compared to a dry trip-out (open-end string) for the same stand will result in:", "opts": ["A higher trip tank gain because mud comes out with the string", "A lower trip tank gain because the mud inside the pipe also exits", "Identical trip tank readings", "No measurable change in tank level"], "answer": "B"}, {"n": 39, "q": "During tripping, a measured tank volume change that is significantly different from the calculated steel displacement may indicate:", "opts": ["A normal trip with no issues", "A possible kick (gain) or losses (loss)", "Pump efficiency loss only", "A faulty trip schedule"], "answer": "B"}, {"n": 40, "q": "Which document does the mud logger compare actual trip tank levels against during a trip?", "opts": ["Daily drilling report", "Trip sheet / trip schedule", "Cement bond log", "IADC bit record"], "answer": "B"}, {"n": 41, "q": "Ditch samples (drill cuttings) are collected by the mud logger or sample catcher from:", "opts": ["The mud pump suction line", "The shale shaker", "The choke manifold", "The cement unit"], "answer": "B"}, {"n": 42, "q": "To correctly assign drilled cuttings to their true depth of origin, the mud logger applies the:", "opts": ["Pump pressure correction", "Lag time correction", "Temperature correction", "Density correction"], "answer": "B"}, {"n": 43, "q": "For oil-based mud, dry cuttings samples are typically washed using:", "opts": ["A jet of fresh water only", "A detergent solution and then passed through a 5 mm sieve", "Acetone followed by deionized water", "Concentrated hydrochloric acid"], "answer": "B"}, {"n": 44, "q": "Which of the following is NOT a standard parameter described during microscopic cuttings analysis?", "opts": ["Rock type and lithology", "Grain shape and size", "Hydrocarbon show and fluorescence", "Mud pump efficiency"], "answer": "D"}, {"n": 45, "q": "Which oil show identification technique is generally NOT reliable when drilling with oil-based mud?", "opts": ["Odor", "Fluorescence under UV", "Cut test with solvent", "Gas chromatography of C1 to C5"], "answer": "A"}, {"n": 46, "q": "Lighter colored oil staining on cuttings is generally indicative of:", "opts": ["Heavy crude with low API gravity", "Light hydrocarbon with high API gravity", "Water-bearing zone", "Tar mat"], "answer": "B"}, {"n": 47, "q": "Connection gas observed on the gas log is typically attributed to:", "opts": ["Carbide added to the drill pipe", "Loss of equivalent circulating density (ECD) when pumps are off", "Surface contamination from diesel", "Bacterial activity in the mud pits"], "answer": "B"}, {"n": 48, "q": "The total gas detector commonly used in mud logging operates on the principle of:", "opts": ["Infrared absorption of methane only", "Ionization of hydrocarbon molecules in a hot hydrogen flame (FID)", "Electrical conductivity of the mud", "X-ray fluorescence"], "answer": "B"}, {"n": 49, "q": "A gas chromatograph used in mud logging is typically capable of separating and detecting which range of hydrocarbon components?", "opts": ["C1 only", "C1 through C5 (including iso and normal isomers of C4)", "C6 through C12", "Only non-hydrocarbon gases such as CO2 and N2"], "answer": "B"}, {"n": 50, "q": "Which sensor is mounted on the rig's deadline anchor system to measure the weight supported by the traveling block?", "opts": ["Hook load sensor", "Torque sensor", "Pump stroke counter", "Pit volume sensor"], "answer": "A"}]}, {"title": "Unit 2 – Directional Drilling", "questions": [{"n": 1, "q": "Which statement best describes directional drilling?", "opts": ["A surface technique to locate hydrocarbon reservoirs", "A technique to drill wells along non-vertical paths to reach specific underground targets", "A drilling technique used only when vertical wells fail", "A method that always produces horizontal wellbores"], "answer": "B"}, {"n": 2, "q": "All of the following are typical applications of directional drilling EXCEPT:", "opts": ["Sidetracking around stuck pipe", "Reaching reservoirs beneath inaccessible surface locations", "Drilling a relief well to control a blowout", "Increasing the surface footprint of a single rig"], "answer": "D"}, {"n": 3, "q": "Why is directional drilling used to reach reservoirs under environmentally protected or urban areas?", "opts": ["It allows the rig to be located in an accessible area while still reaching the target", "It is cheaper than any vertical well", "It avoids the need for a drilling permit", "It eliminates the need for casing"], "answer": "A"}, {"n": 4, "q": "Sidetracking is best described as:", "opts": ["Plugging and abandoning a well", "Drilling a completely new well from a separate surface location", "Drilling a new wellbore from an existing wellbore", "Running a logging tool sideways into the formation"], "answer": "C"}, {"n": 5, "q": "A common reason to perform a sidetrack is:", "opts": ["To install a larger rotary table", "To convert a producer into an injector at surface", "To bypass a fish or junk in the original wellbore, or to reach a new target", "To reduce drilling fluid cost"], "answer": "C"}, {"n": 6, "q": "When drilling near a salt dome, directional drilling is often used to:", "opts": ["Avoid using any casing strings", "Eliminate the need for mud weight control", "Navigate through and around salt formations to reach hydrocarbons trapped beneath", "Drill directly through the centre of the salt at all times"], "answer": "C"}, {"n": 7, "q": "In fault-controlled drilling, the directional well path is planned to:", "opts": ["Reduce the inclination angle to zero before crossing the fault", "Always drill straight through every fault plane at 90 degrees", "Maximise the dogleg severity across the fault", "Intersect the fault plane or bypass fault zones to avoid BHA sliding and instability"], "answer": "D"}, {"n": 8, "q": "Onshore (shoreline) directional drilling targets offshore reservoirs from a land location mainly to:", "opts": ["Reduce operational cost and environmental impact compared with an offshore platform", "Improve hydrocarbon quality", "Eliminate the need for blowout preventers", "Increase reservoir pressure"], "answer": "A"}, {"n": 9, "q": "Offshore multi-well drilling from a single platform is used to:", "opts": ["Maximise the utilisation of offshore infrastructure by drilling multiple wells from one location", "Drill only one well per platform to limit risk", "Reduce the number of casing strings required per well", "Avoid the need for directional surveys"], "answer": "A"}, {"n": 10, "q": "A relief well is drilled to:", "opts": ["Test the cement bond of an adjacent well", "Vent gas to the atmosphere from a depleted reservoir", "Intersect a problematic wellbore and regain control during a blowout incident", "Provide a backup production zone for low-pressure reservoirs"], "answer": "C"}, {"n": 11, "q": "The key difference between a sidetrack and a multilateral well is:", "opts": ["Multilaterals can only be drilled offshore", "A sidetrack abandons the original hole, while a multilateral keeps multiple branches from one main wellbore in service", "Sidetracks are always vertical, multilaterals are always horizontal", "Sidetracks require a relief well; multilaterals do not"], "answer": "B"}, {"n": 12, "q": "The primary objective of multilateral drilling is to:", "opts": ["Reduce surface casing weight", "Eliminate the need for MWD tools", "Replace the need for hydraulic fracturing", "Maximise reservoir contact and production from a single main wellbore"], "answer": "D"}, {"n": 13, "q": "The Kelly Bushing (KB) is used as:", "opts": ["The lower end of the drill string", "The pressure gauge at the standpipe", "A type of stabilizer in the BHA", "The reference point for depth measurements"], "answer": "D"}, {"n": 14, "q": "Measured Depth (MD) is defined as:", "opts": ["The depth at which the bit is changed", "The vertical distance from KB to a point in the well", "The depth of the deepest casing shoe", "The length measured along the wellbore path from KB to a point in the well"], "answer": "D"}, {"n": 15, "q": "True Vertical Depth (TVD) is:", "opts": ["The depth recorded only by gyro surveys", "The vertical distance from the KB datum to a point in the well", "Always equal to MD", "The length along the curved wellbore from KB to a point"], "answer": "B"}, {"n": 16, "q": "For a vertical well, the relationship between MD and TVD is:", "opts": ["MD equals TVD", "TVD is always greater than MD", "There is no defined relationship", "MD is always greater than TVD"], "answer": "A"}, {"n": 17, "q": "For a directional well, MD compared with TVD will be:", "opts": ["Greater than TVD", "Always equal", "Negative", "Less than TVD"], "answer": "A"}, {"n": 18, "q": "The Kick Off Point (KOP) is:", "opts": ["The depth where the wellbore transitions from vertical to follow a desired trajectory", "The depth where drilling fluid is first circulated", "The point at which the well is plugged", "The depth of the deepest survey station"], "answer": "A"}, {"n": 19, "q": "The End of Build (EOB) refers to the depth where:", "opts": ["The build section concludes and the wellbore trajectory starts to stabilize", "The drill bit is replaced", "The casing is set", "The well reaches total depth"], "answer": "A"}, {"n": 20, "q": "In a build, hold, drop wellbore profile, the section where the inclination angle is kept constant is called the:", "opts": ["Build section", "Hold section", "Drop section", "Kick off section"], "answer": "B"}, {"n": 21, "q": "In the build section of a directional well, the inclination angle:", "opts": ["Increases with depth", "Decreases with depth", "Remains constant", "Is always zero"], "answer": "A"}, {"n": 22, "q": "The drop section of a directional well is characterised by:", "opts": ["Constant inclination", "A vertical hole", "Decreasing inclination", "Increasing inclination"], "answer": "C"}, {"n": 23, "q": "Inclination angle is measured between:", "opts": ["The wellbore axis and a horizontal reference plane", "Magnetic north and true north", "The wellbore axis and a vertical reference line", "Two adjacent survey stations"], "answer": "C"}, {"n": 24, "q": "Azimuth is best defined as:", "opts": ["The build rate of the wellbore", "The horizontal angle measured clockwise from a reference direction (often north) to the wellbore projection on a horizontal plane", "The angle between the wellbore and the vertical", "The dogleg severity per 100 ft"], "answer": "B"}, {"n": 25, "q": "The azimuth of a well drilled due west is approximately:", "opts": ["180 degrees", "90 degrees", "0 degrees", "270 degrees"], "answer": "D"}, {"n": 26, "q": "Magnetic tool face is the angle projection onto the horizontal plane between the tool face and:", "opts": ["The high side of the hole", "The low side of the hole", "Magnetic north", "True north"], "answer": "C"}, {"n": 27, "q": "Gravity tool face is typically used when:", "opts": ["Drilling a strictly vertical well", "Running a gyro survey only", "The well inclination is very small (below about 5 degrees)", "The well inclination is high enough that high side and low side of the hole are clearly defined"], "answer": "D"}, {"n": 28, "q": "The primary function of drill collars in the BHA is to:", "opts": ["Act as a check valve for the drilling fluid", "Provide weight on bit and stiffness to the lower drill string", "Transmit MWD pulses to surface", "House the gyro survey tool"], "answer": "B"}, {"n": 29, "q": "Heavy Wall Drill Pipe (HWDP) differs from standard drill pipe in that it has:", "opts": ["A thicker wall than standard drill pipe with the same outside diameter", "A larger outside diameter than drill collars", "No tool joints", "Internal cables for telemetry"], "answer": "A"}, {"n": 30, "q": "Stabilizers in a BHA are mainly used to:", "opts": ["Replace the function of the drill bit", "Centralise the BHA in the hole and control deviation tendencies", "Measure formation gamma ray", "Provide additional weight on bit"], "answer": "B"}, {"n": 31, "q": "A bent sub creates a directional BHA because:", "opts": ["It is made of non-magnetic material", "It increases the flow area through the bit", "The pin and box have an offset angle relative to each other", "It contains a magnet that aligns with north"], "answer": "C"}, {"n": 32, "q": "Downhole motors used in directional drilling are powered by:", "opts": ["The circulating drilling fluid", "Mechanical drive from the rotary table", "Electric cable from surface", "Compressed air from the rig"], "answer": "A"}, {"n": 33, "q": "Which of the following are the two main types of downhole motors?", "opts": ["Gyro motors and magnetic motors", "Mud pulse and electromagnetic motors", "Stabilizer motors and bent sub motors", "Turbines and positive displacement motors (PDM)"], "answer": "D"}, {"n": 34, "q": "A steerable motor differs from a basic bent sub and PDM assembly in that it:", "opts": ["Is only used for vertical wells", "Cannot be rotated from surface", "Can be either oriented for sliding mode or rotated from surface for rotary mode", "Does not require any bent housing"], "answer": "C"}, {"n": 35, "q": "When a bent sub and PDM assembly is used in oriented (sliding) mode, the drill string at surface is:", "opts": ["Disconnected from the top drive", "Rotated continuously", "Not rotated; only the bit turns, driven by the motor", "Reciprocated rapidly up and down"], "answer": "C"}, {"n": 36, "q": "A Rotary Steerable System (RSS) allows the operator to:", "opts": ["Eliminate the need for any MWD tool", "Continuously rotate the drill string while steering the bit", "Steer the well only while sliding with no string rotation", "Drill only vertical wells"], "answer": "B"}, {"n": 37, "q": "Compared with steerable motor BHAs, RSS is particularly advantageous when drilling:", "opts": ["Extended-reach and deepwater wells", "Shallow vertical wells", "Surface conductor holes only", "Cement plugs"], "answer": "A"}, {"n": 38, "q": "Whipstocks are most commonly used to:", "opts": ["Measure azimuth in cased hole", "Deflect the bit and sidetrack out of casing", "Centralise the drill string in deviated wells", "Provide weight on bit in vertical wells"], "answer": "B"}, {"n": 39, "q": "MWD (Measurement While Drilling) primarily provides:", "opts": ["Post-job laboratory analysis of cuttings", "Cement bond logs", "Surface mud properties only", "Real-time directional and mechanical data such as inclination, azimuth, temperature, pressure, weight on bit and downhole vibration"], "answer": "D"}, {"n": 40, "q": "LWD (Logging While Drilling) records and transmits which type of data during drilling?", "opts": ["Surface pump pressure only", "Geological formation properties such as resistivity, gamma ray and density", "Drill string fatigue cycles only", "Only directional data such as inclination and azimuth"], "answer": "B"}, {"n": 41, "q": "Which of the following is NOT a typical MWD measurement?", "opts": ["Azimuth", "Inclination", "Downhole vibration", "Crude oil API gravity at surface"], "answer": "D"}, {"n": 42, "q": "Which of these is a common data transmission method shared by MWD and LWD tools?", "opts": ["Mud pulse telemetry", "Hydraulic line in the riser", "Wireline through the annulus", "Acoustic surface megaphone"], "answer": "A"}, {"n": 43, "q": "Apart from mud pulse telemetry, which other transmission method is used for MWD and LWD?", "opts": ["Manual hand signals from a downhole operator", "Satellite uplink from the bit", "Electromagnetic telemetry and wired drill pipe", "Pneumatic pulses through the annulus"], "answer": "C"}, {"n": 44, "q": "Why is real-time LWD data important during directional drilling?", "opts": ["It allows the team to geosteer the well to stay within the target formation and make timely decisions", "It is used only for post-well reporting", "It replaces the need for casing design", "It eliminates the need for any surface mud logging"], "answer": "A"}, {"n": 45, "q": "A well survey is performed to determine:", "opts": ["The well location and trajectory (inclination and azimuth at each station)", "The mud weight at the bit", "The crew rotation schedule", "The cost per foot of drilling"], "answer": "A"}, {"n": 46, "q": "In a typical MWD survey procedure, the usual practice is to:", "opts": ["Stop the mud pumps for one hour at each station", "Pull out of the hole completely before each survey", "Continue drilling without stopping while data is recorded", "Tag bottom, pick up 5 to 10 ft and hold the pipe steady for about 2 minutes to allow the survey to be stored, then resume drilling so data is transmitted to surface"], "answer": "D"}, {"n": 47, "q": "A magnetic single-shot or multi-shot survey is typically run in:", "opts": ["Cased hole only", "A water-filled mud pit", "The riser above the wellhead", "Open hole, with a non-magnetic drill collar in the BHA"], "answer": "D"}, {"n": 48, "q": "Why is a non-magnetic drill collar required when running a magnetic survey tool?", "opts": ["To prevent the surrounding steel from distorting the magnetic field used by the survey instrument", "To increase pump pressure", "To improve cement bonding", "To reduce the weight on bit"], "answer": "A"}, {"n": 49, "q": "Compared with magnetic surveys, gyroscopic surveys can be run:", "opts": ["In either cased or open hole, without requiring non-magnetic drill collars", "Only at surface before spud", "Only while drilling ahead", "Only in open hole"], "answer": "A"}, {"n": 50, "q": "Which of the following is a core responsibility of the Directional Driller on the rig?", "opts": ["Running the cement job", "Planning the well trajectory, operating downhole steering tools and making real-time decisions to adjust the well path", "Operating the crown block", "Mixing the drilling fluid in the mud pits"], "answer": "B"}]}, {"title": "Unit 3 – UBD & MPD", "questions": [{"n": 1, "q": "In conventional (overbalanced) drilling, the wellbore pressure should always be:", "opts": ["Higher than the formation pore pressure but lower than the fracture pressure", "Equal to the formation pore pressure", "Higher than the formation fracture pressure", "Lower than the formation pore pressure"], "answer": "A"}, {"n": 2, "q": "The typical overbalance margin maintained above formation pore pressure in conventional drilling is approximately:", "opts": ["20 to 50 psi", "200 to 300 psi", "1000 to 1500 psi", "3000 to 5000 psi"], "answer": "B"}, {"n": 3, "q": "Under shut-in (SI) conditions, the bottom-hole pressure (BHP) is calculated as:", "opts": ["Hydrostatic pressure only", "Hydrostatic pressure plus annular friction losses", "Hydrostatic pressure plus surface shut-in pressure", "Hydrostatic pressure minus surface back pressure"], "answer": "C"}, {"n": 4, "q": "During circulation in conventional drilling, the BHP is best expressed as:", "opts": ["Hydrostatic pressure in annulus only", "Fracture pressure plus surface back pressure", "Hydrostatic pressure minus annular friction losses", "Hydrostatic pressure in annulus plus friction losses in annulus plus surface annulus pressure"], "answer": "D"}, {"n": 5, "q": "ECD stands for:", "opts": ["Equivalent Circulating Density", "Effective Circulating Density", "Estimated Continuous Density", "Equivalent Compressive Density"], "answer": "A"}, {"n": 6, "q": "The dashed mud-pressure line on the pressure-depth plot (different from the static line) represents:", "opts": ["The formation fracture gradient", "The mud pressure when circulating, which includes annular friction losses", "The pore pressure profile", "The casing burst rating"], "answer": "B"}, {"n": 7, "q": "Which pressure boundary must the wellbore pressure NEVER exceed in conventional drilling?", "opts": ["Pore pressure", "Hydrostatic pressure", "Formation fracture pressure", "Surface back pressure"], "answer": "C"}, {"n": 8, "q": "If the wellbore pressure falls below the pore pressure in conventional drilling, the most likely outcome is:", "opts": ["Lost circulation", "Reduced rate of penetration", "Differential sticking", "Formation kick or influx"], "answer": "D"}, {"n": 9, "q": "Underbalanced drilling (UBD) is defined as drilling where the pressure exerted by the drilling fluid in the wellbore is:", "opts": ["Less than or equal to the formation pore pressure", "Higher than the formation pore pressure", "Equal to the formation fracture pressure", "Independent of pore pressure"], "answer": "A"}, {"n": 10, "q": "In UBD, the drilling fluid returns to:", "opts": ["An open circulation system", "A closed circulation system", "A reserve pit", "Directly to the burner with no separation"], "answer": "B"}, {"n": 11, "q": "Which of the following is considered a benefit (Good) of UBD?", "opts": ["Increased risk of differential sticking", "Reduced wellbore stability", "Higher rate of penetration (ROP)", "Higher water inflow handling difficulty"], "answer": "C"}, {"n": 12, "q": "Which of the following is considered a drawback (Bad) of UBD?", "opts": ["Reduced losses and formation damage", "Higher ROP", "Reduced differential sticking", "Reduced wellbore stability"], "answer": "D"}, {"n": 13, "q": "Why is UBD particularly attractive for depleted reservoirs?", "opts": ["It avoids further pressure-driven damage to the depleted zone", "It increases the chance of differential sticking", "It requires no additional surface equipment", "It eliminates the need for well control"], "answer": "A"}, {"n": 14, "q": "Which statement about water inflow from high-permeability formations during UBD is correct?", "opts": ["It improves wellbore stability", "It can kill the well and is considered a negative factor", "It is welcomed because it provides cooling", "It has no operational impact"], "answer": "B"}, {"n": 15, "q": "Compared with conventional drilling, UBD generally requires:", "opts": ["Less equipment and lower cost", "The same equipment and cost", "Addition of substances, more equipment, and higher cost", "Only a change in drilling fluid density"], "answer": "C"}, {"n": 16, "q": "In UBD, a drilling fluid consisting of liquid entrained in a gaseous phase is called:", "opts": ["Foam", "Gasified liquid", "Aerated mud", "Mist"], "answer": "D"}, {"n": 17, "q": "A UBD drilling fluid made of liquid, surfactant, and gas is known as:", "opts": ["Foam", "Aerated mud", "Mist", "Gasified liquid"], "answer": "A"}, {"n": 18, "q": "The approximate density range of foam used in UBD is:", "opts": ["0 to 0.02 ppg", "0.6 to 5.0 ppg", "0.2 to 0.6 ppg", "6.9 ppg and above"], "answer": "B"}, {"n": 19, "q": "Pure gas drilling fluids (air or nitrogen) are MOST commonly used for:", "opts": ["Deep HPHT oil wells", "Offshore deepwater wells", "Hard-rock drilling and water wells", "High-pressure gas reservoirs only"], "answer": "C"}, {"n": 20, "q": "If the required hole size in UBD is larger than 6 1/8 inch, the preferred drilling system is:", "opts": ["Coiled tubing only", "Slickline", "Wireline", "Jointed pipe"], "answer": "D"}, {"n": 21, "q": "The Rotating Control Device (RCD) is installed:", "opts": ["On top of the conventional BOP stack", "Below the wellhead", "Inside the drill string", "On the mud return line downstream of the choke"], "answer": "A"}, {"n": 22, "q": "The primary function of the RCD is to:", "opts": ["Replace the BOP stack", "Provide an effective annular seal around the drill pipe during drilling and tripping", "Measure bottom-hole pressure", "Separate gas from liquid at surface"], "answer": "B"}, {"n": 23, "q": "The key operational difference between an RCD and a conventional annular BOP is that the RCD:", "opts": ["Cannot seal around the drill pipe", "Is only used after a kick is detected", "Is designed to seal around the drill pipe while it is rotating", "Operates without any sealing element"], "answer": "C"}, {"n": 24, "q": "A surface safety valve in a UBD setup is typically installed:", "opts": ["Between the mud pumps and the standpipe", "Inside the drill string above the bit", "Downstream of the four-phase separator", "Between the wellhead and the choke manifold"], "answer": "D"}, {"n": 25, "q": "ESD in the context of UBD surface equipment stands for:", "opts": ["Emergency Shut Down system", "Electrostatic Separation Device", "Equivalent Surface Density", "Externally Sealed Diverter"], "answer": "A"}, {"n": 26, "q": "A typical UBD choke manifold may incorporate:", "opts": ["Three hydraulic chokes only", "One hydraulic choke and two manual chokes", "Two adjustable chokes and a flare line only", "Only manual chokes with no hydraulic option"], "answer": "B"}, {"n": 27, "q": "Surface separation equipment used in UBD is most commonly a:", "opts": ["Single-phase gas knockout drum", "Two-phase oil and water separator", "Four-phase (multi-phase) separator handling gas, oil, water, and solids", "Centrifuge only"], "answer": "C"}, {"n": 28, "q": "The function of a Pressure While Drilling (PWD) sensor in UBD is to:", "opts": ["Measure surface pump pressure", "Control the choke automatically", "Detect H2S concentration", "Provide downhole pressure measurement to enhance UBD pressure control"], "answer": "D"}, {"n": 29, "q": "In UBD with gaseous or two-phase drilling fluids, conventional mud-pulse MWD telemetry is generally:", "opts": ["Unsuitable, because the compressible fluid does not transmit pressure pulses reliably", "The preferred telemetry method", "Mandatory for safety reasons", "More accurate than electromagnetic telemetry"], "answer": "A"}, {"n": 30, "q": "Non-return valves (NRVs) in the UBD drill string are necessary to:", "opts": ["Increase circulating pressure", "Prevent influx of reservoir fluids from entering the drill string", "Replace the float collar in the casing string", "Allow back-flow during connections"], "answer": "B"}, {"n": 31, "q": "A deployment valve in UBD is best described as:", "opts": ["A valve installed inside the drill string", "A choke valve on the return line", "A valve run as part of the casing string and operated via a control line", "A blow-down valve on the separator"], "answer": "C"}, {"n": 32, "q": "The key difference between a non-return valve and a deployment valve is that:", "opts": ["Both are installed in the drill string", "They are functionally identical", "The deployment valve is automatic and the NRV needs a control line", "The NRV is in the drill string while the deployment valve is part of the casing and requires a control line"], "answer": "D"}, {"n": 33, "q": "Managed Pressure Drilling (MPD) is BEST defined as:", "opts": ["An adaptive drilling process that precisely controls the annular pressure profile in the wellbore", "Drilling deliberately underbalanced to allow inflow", "Drilling without any annular pressure control", "Drilling with a fixed overbalance of 1000 psi"], "answer": "A"}, {"n": 34, "q": "In MPD, the wellbore pressure is maintained:", "opts": ["Below the pore pressure at all times", "Between the pore pressure and the fracture pressure during both circulating and static conditions", "Above the fracture pressure at all times", "Equal to atmospheric pressure"], "answer": "B"}, {"n": 35, "q": "In MPD, the BHP during circulation is expressed as:", "opts": ["Surface back pressure minus annular friction", "Hydrostatic pressure minus surface back pressure", "Hydrostatic pressure plus annular friction pressure plus surface back pressure (SBP)", "Annular friction only"], "answer": "C"}, {"n": 36, "q": "When circulation is stopped in MPD, the loss of annular friction pressure is typically compensated by:", "opts": ["Increasing the mud density on the fly", "Reducing the casing depth", "Closing the BOP", "Applying surface back pressure (SBP) via the choke and back-pressure pump"], "answer": "D"}, {"n": 37, "q": "MPD is particularly suited to drilling environments characterized by:", "opts": ["Narrow pressure margins between pore and fracture pressure", "Wide pressure margins between pore and fracture pressure", "No pore-pressure data", "Shallow water wells only"], "answer": "A"}, {"n": 38, "q": "Which of the following is NOT a typical benefit of MPD?", "opts": ["Mitigation of differential sticking and kicks", "Increased non-productive time (NPT)", "Reduction in the number of casing strings required", "Reduced lost circulation"], "answer": "B"}, {"n": 39, "q": "MPD helps to limit the number of casing strings by:", "opts": ["Eliminating the need for pore-pressure prediction", "Increasing the overbalance significantly", "Allowing the wellbore pressure to stay within narrow margins so fewer casing points are needed", "Removing the need for cementing"], "answer": "C"}, {"n": 40, "q": "Compared with UBD, MPD primarily aims to:", "opts": ["Produce hydrocarbons during drilling", "Eliminate the need for an RCD", "Drill with air or nitrogen as the main fluid", "Keep the wellbore pressure slightly above pore pressure to avoid influx while staying below fracture pressure"], "answer": "D"}, {"n": 41, "q": "Which of the following is NOT a typical MPD surface equipment item?", "opts": ["Four-phase production separator", "Auto choke and choke manifold", "Back pressure pump", "Rotating Control Device (RCD)"], "answer": "A"}, {"n": 42, "q": "The Rig Pump Diverter (RPD) in an MPD system is used to:", "opts": ["Replace the standpipe manifold", "Divert rig pump flow through the MPD manifold and back-pressure system", "Cool the mud before it enters the well", "Separate gas from the returns"], "answer": "B"}, {"n": 43, "q": "The function of the back-pressure pump in MPD is to:", "opts": ["Pump cuttings to the shale shaker", "Inject nitrogen into the annulus", "Maintain flow through the choke and apply surface back pressure when rig pumps are off", "Boost flow into the formation"], "answer": "C"}, {"n": 44, "q": "The flow meter in an MPD system is used primarily to:", "opts": ["Measure surface temperature", "Measure mud weight", "Replace the trip tank", "Provide accurate real-time measurement of returns to detect kicks and losses early"], "answer": "D"}, {"n": 45, "q": "A float valve in the MPD drill string serves to:", "opts": ["Prevent back-flow of wellbore fluids up through the drill string", "Allow free back-flow up the drill string", "Measure downhole pressure", "Open the annulus to the atmosphere"], "answer": "A"}, {"n": 46, "q": "The auto choke in an MPD system adjusts choke opening based on:", "opts": ["Manual operator input only, with no automation", "Real-time pressure and flow data to maintain the target BHP", "Mud temperature only", "Pit volume only"], "answer": "B"}, {"n": 47, "q": "Designing the UBD or MPD operation and program is primarily the responsibility of:", "opts": ["The equipment operator", "The driller", "The engineers", "The mud logger"], "answer": "C"}, {"n": 48, "q": "Leading safety meetings and ensuring compliance with well-control procedures and company policies is the responsibility of:", "opts": ["The engineer", "The equipment operator", "The roustabout", "The supervisor"], "answer": "D"}, {"n": 49, "q": "Rigging up, maintaining, and troubleshooting UBD or MPD surface equipment is primarily the responsibility of:", "opts": ["The equipment operator(s)", "The drilling engineer", "The mud engineer", "The toolpusher"], "answer": "A"}, {"n": 50, "q": "A distinctive surface-pressure hazard in UBD or MPD operations compared with conventional drilling is that:", "opts": ["Surface flow lines are at atmospheric pressure", "Surface lines are live (under pressure) and may cause pressure-trapped injuries if opened or disconnected without bleed-down", "There is no pressure at the choke manifold", "The BOP is removed during operations"], "answer": "B"}]}, {"title": "Unit 4 – Fishing & Milling Operations", "questions": [{"n": 1, "q": "Which of the following best defines a fishing operation in a well?", "opts": ["Removing lost or stuck objects such as string, cable, or junk that have parted, been cut, or left in the hole", "Setting a production packer above the reservoir", "Logging the well with wireline tools", "Pumping treated water to clean perforations"], "answer": "A"}, {"n": 2, "q": "Which statement best describes milling?", "opts": ["The process of pumping acid to dissolve scale inside tubing", "The process of running a gauge cutter to confirm well bore drift", "The process of steel grinding or removal from inside the wellbore", "The process of running a cement plug across a casing window"], "answer": "C"}, {"n": 3, "q": "Before deciding to fish a junk from a well, the primary commercial consideration is:", "opts": ["The cost and risk of fishing versus the value of recovery", "The color of the drilling fluid", "The day rate of the wireline unit", "The age of the rig"], "answer": "A"}, {"n": 4, "q": "Which of the following is NOT a standard piece of information to establish about the junk before fishing?", "opts": ["Size of the junk", "Weight of the junk", "Magnetic properties of the junk", "Market price of scrap steel"], "answer": "D"}, {"n": 5, "q": "An impression block is used primarily to:", "opts": ["Cut the fish at a planned depth", "Recover ferrous junk magnetically", "Obtain a physical imprint of the top of the fish to plan the fishing approach", "Mill the inside diameter of casing"], "answer": "C"}, {"n": 6, "q": "The soft, marking face of an impression block is typically made of:", "opts": ["Tungsten carbide", "Hardened tool steel", "Lead or a similar soft material such as wax or rubber", "Stainless steel mesh"], "answer": "C"}, {"n": 7, "q": "Tubular fishing specifically refers to the recovery of:", "opts": ["Tubing, drill pipe, casing or similar pipe-shaped fish", "Cement plugs only", "Loose sand and cuttings", "Wireline cable only"], "answer": "A"}, {"n": 8, "q": "Which of the following is a valid reason NOT to attempt fishing a particular junk?", "opts": ["The estimated cost and risk of fishing exceed the value of recovery and side-tracking is cheaper", "The fish is made of steel", "An overshot is available on the rig", "The well is vertical"], "answer": "A"}, {"n": 9, "q": "An overshot is classified as which type of fishing tool?", "opts": ["External catch tool that engages the outside diameter of a tubular fish", "Magnetic recovery tool", "Wash-over tool", "Internal catch tool"], "answer": "A"}, {"n": 10, "q": "In an overshot, the component that directs the fish into the tool is called the:", "opts": ["Grapple", "Packer", "Guide", "Bowl"], "answer": "C"}, {"n": 11, "q": "When upward pull is applied to an overshot that has swallowed the fish, the grapple is:", "opts": ["Contracted by the tapers of the bowl, gripping the fish tightly", "Sheared off and left in the hole", "Rotated independently of the bowl", "Expanded by the tapers of the bowl, releasing the fish"], "answer": "A"}, {"n": 12, "q": "Which two grapple types are most commonly used inside an overshot bowl?", "opts": ["Spiral grapple and basket grapple", "Magnetic grapple and hydraulic grapple", "Roller grapple and chain grapple", "Pin grapple and box grapple"], "answer": "A"}, {"n": 13, "q": "The function of the overshot packer is to:", "opts": ["Seal between the overshot and the fish so circulation can be diverted through the fish", "Prevent the overshot from rotating during the run", "Hold the guide on the bottom of the tool", "Lock the grapple permanently in place"], "answer": "A"}, {"n": 14, "q": "When the fish enters an overshot, the grapple initially:", "opts": ["Expands to allow the fish to pass into it", "Shears off", "Locks against the guide", "Contracts to grip the fish"], "answer": "A"}, {"n": 15, "q": "A die collar is best described as:", "opts": ["A tool that mills the top of the fish flat", "An internal catch tool that cuts threads on the inside of the fish", "An external catch tool that cuts threads on the outside diameter of the fish", "A magnetic tool for collecting small steel chips"], "answer": "C"}, {"n": 16, "q": "Which condition particularly favors the use of a die collar over an overshot?", "opts": ["The outside diameter of the fish is known precisely", "The fish is non-ferrous", "The outside diameter of the fish is unknown or irregular", "The fish is stuck in open hole only"], "answer": "C"}, {"n": 17, "q": "A die collar engages the fish by:", "opts": ["Cementing itself to the fish", "Magnetic attraction", "Cutting a thread on the outside of the fish with applied weight and rotation", "Wedging hardened slips against the inside of the fish"], "answer": "C"}, {"n": 18, "q": "A taper tap is classified as:", "opts": ["A junk basket", "An external catch tool", "An internal catch tool that cuts a full thread inside the fish", "A circulation sub"], "answer": "C"}, {"n": 19, "q": "Which two parameters are applied to make a taper tap or die collar bite into the fish?", "opts": ["Weight on tool and rotation", "High circulation rate and no rotation", "Tension and back-off shot", "Heat and chemical etching"], "answer": "A"}, {"n": 20, "q": "When choosing between a taper tap and a die collar, the deciding factor is generally:", "opts": ["The age of the well", "The colour of the fish", "Whether engagement is required on the inside diameter or the outside diameter of the fish", "The mud weight in use"], "answer": "C"}, {"n": 21, "q": "A fishing spear is used to:", "opts": ["Recover non-ferrous junk", "Grip the outside of a tubular fish", "Catch the inside diameter of a tubular fish such as drill pipe, tubing, tool or casing", "Mill the top of the fish"], "answer": "C"}, {"n": 22, "q": "Spears are typically released from the fish by:", "opts": ["Increasing the pumping rate", "Right-hand rotation followed by an upward pull", "Left-hand rotation while picking up to release the grapple", "Heating the tool with chemical reaction"], "answer": "C"}, {"n": 23, "q": "The releasing nut on a spear is used to:", "opts": ["Seal the bottom of the fish", "Lock the grapple in the engaged position only", "Allow the operator to disengage the spear from the fish when required", "Increase the mud flow through the spear"], "answer": "C"}, {"n": 24, "q": "Which of the following fish types is most appropriately recovered with a spear?", "opts": ["Loose sand at the bottom of the well", "A small piece of magnetic swarf", "A length of tubing where the inside diameter is accessible", "A wireline cable bird-nested at the top of the hole"], "answer": "C"}, {"n": 25, "q": "A fishing magnet is most useful for recovering:", "opts": ["Cement plugs", "Rubber elements from packers", "Brass, aluminium and stainless steel debris", "Ferrous metal debris such as bit cones and steel chips"], "answer": "D"}, {"n": 26, "q": "Which of the following materials will a standard fishing magnet NOT recover?", "opts": ["Steel slip segment", "Iron tong dies", "Mild steel bit cone", "Tungsten carbide insert"], "answer": "D"}, {"n": 27, "q": "Fishing magnets can be conveyed into the well on:", "opts": ["Drill pipe only", "Wireline only", "Either drill pipe or wireline, depending on the magnet type", "Coiled tubing only, never drill pipe"], "answer": "C"}, {"n": 28, "q": "Before activating the magnet at total depth, it is common practice to:", "opts": ["Increase mud weight", "Set a cement plug", "Pull out of hole immediately", "Trip the tool a few metres off bottom and perform circulation to clean the area of chips and sediment"], "answer": "D"}, {"n": 29, "q": "Reverse circulation while operating certain fishing magnets is used to:", "opts": ["Release the magnet from the fish", "Set a packer above the magnet", "Cool the magnet", "Pull the ball into the drill pipe and inject through the ball seat to help direct debris toward the magnet face"], "answer": "D"}, {"n": 30, "q": "A wash-over pipe is best described as:", "opts": ["A flush-joint pipe connected to a wash-over shoe, used to surround a stuck tubular while the shoe mills past the obstruction", "A small diameter pipe used only for circulation", "A pipe used to set cement plugs", "A pipe used exclusively in horizontal sections"], "answer": "A"}, {"n": 31, "q": "The role of the wash-over shoe at the bottom of the wash-over assembly is to:", "opts": ["Cut the fish in two pieces", "Catch the inside diameter of the fish", "Seal against the casing", "Wash and lightly mill over the stuck fish, removing junk from the outside of the fish"], "answer": "D"}, {"n": 32, "q": "Which component is typically run above the wash-over pipe to allow recovery of the wash-over string if it becomes stuck itself?", "opts": ["A whipstock", "A junk mill", "A circulating valve", "A wash-over back-off safety joint"], "answer": "D"}, {"n": 33, "q": "A wave-like wash-over shoe is typically run to bottom at:", "opts": ["High rotor speed with no circulation", "Low speed of rotor and working pumps in order to circulate drilling fluid", "Maximum rotation with no weight on tool", "Zero rotation and zero circulation"], "answer": "B"}, {"n": 34, "q": "When operating a wash-over shoe, rotation is normally started:", "opts": ["After contact with the obstruction with full weight applied", "At a distance not less than about 0.3 to 0.5 metre from the bottom, then weight and rotation are increased gradually", "Only after the entire fish has been swallowed", "Only at surface, before running in hole"], "answer": "B"}, {"n": 35, "q": "Rotary shoes used with wash-over pipe or in milling operations are commonly applied to:", "opts": ["Cement plug drill-out only", "Milling packer slips, where the specific design is dictated by the application", "Wireline cable recovery", "Sand bailing operations"], "answer": "B"}, {"n": 36, "q": "Which statement about rotary shoe design is correct?", "opts": ["Only one universal design is used for all applications", "Different designs are available, each suited to specific applications such as type of packer or junk to be milled", "All rotary shoes are dressed with polycrystalline diamond compact cutters only", "Rotary shoes are always run on wireline"], "answer": "B"}, {"n": 37, "q": "Junk mills are typically dressed with which cutting material?", "opts": ["Tungsten carbide, which allows them to mill up almost anything", "Soft lead inserts", "Plastic teeth", "Copper buttons"], "answer": "A"}, {"n": 38, "q": "Which two bottom profiles are commonly described for a flat-bottom junk mill?", "opts": ["Convex and pointed", "Flat or concave bottom", "Bullet-nosed and tapered", "Hemispherical and conical"], "answer": "B"}, {"n": 39, "q": "When running a junk mill to bottom, recommended practice is to:", "opts": ["Slam it onto bottom with maximum weight and rotation immediately", "Reach bottom with low rotor speed and working pumps, start rotation slightly off bottom, then slowly increase axial load and rotation speed", "Stop circulation at bottom to maximize the cutting action", "Pick the mill 30 metres off bottom and free-fall"], "answer": "B"}, {"n": 40, "q": "A tapered mill is most commonly used for:", "opts": ["Magnetic recovery of small debris", "De-burring casing windows, gauge runs before running internal liners, and milling out collapsed casing", "Wireline retrieval of perforating guns", "Sand bailing in shallow wells"], "answer": "B"}, {"n": 41, "q": "Which of the following is NOT a typical application of a tapered mill?", "opts": ["De-burring a casing window", "Making a gauge run prior to running an internal liner", "Milling collapsed casing", "Recovering loose ferrous swarf magnetically"], "answer": "D"}, {"n": 42, "q": "A watermelon or string mill is typically used to:", "opts": ["Clean up whipstock windows or ream out collapsed casing", "Drill new pay zones", "Set a cement retainer", "Catch wireline fish"], "answer": "A"}, {"n": 43, "q": "The cutting surface of a watermelon mill is shaped to:", "opts": ["Cut only on the bottom face", "Provide cutting action on the sides of the tool over a long length so it can ream and dress the wellbore wall", "Magnetically pick up steel chips", "Cement the wellbore"], "answer": "B"}, {"n": 44, "q": "A pilot mill is designed to:", "opts": ["Mill thin sheet metal at surface", "Mill thick wall tubulars while being guided centrally by a small mill that stings into the tubular bore", "Recover non-magnetic junk only", "Replace a wireline retrieving tool"], "answer": "B"}, {"n": 45, "q": "Which of the following items can a pilot mill be used on?", "opts": ["Tubing, drill pipe, sleeves, tails and packers", "Open hole formations only", "Wireline cable only", "Cement only"], "answer": "A"}, {"n": 46, "q": "The general function of a junk basket is to:", "opts": ["Cut threads on a fish", "Collect pieces of loose junk and cuttings inside the wellbore", "Set a permanent packer", "Magnetize stainless steel debris"], "answer": "B"}, {"n": 47, "q": "Which of the following is NOT a standard type of junk basket?", "opts": ["Globe basket", "Reverse basket", "Boot basket", "Spiral grapple basket"], "answer": "D"}, {"n": 48, "q": "A boot-type junk basket collects junk primarily because of:", "opts": ["High annular velocity inside the basket", "Reduced annular velocity at the junk basket opening, which allows particles to drop into the basket", "Magnetic force generated by the bit", "Hydraulic shock from surface pumps"], "answer": "B"}, {"n": 49, "q": "Where is a boot basket typically placed in the bottom hole assembly?", "opts": ["At surface, above the kelly", "Directly above a bit or junk mill", "Below the bit, between the bit and the formation", "Above the top drive"], "answer": "B"}, {"n": 50, "q": "A reverse circulation junk basket recovers debris by:", "opts": ["Producing strong magnetic attraction at the basket face", "Diverting flow so that returning fluid carries cuttings up into the basket where they are trapped", "Cutting threads on the fish", "Heating the fish until it expands"], "answer": "B"}]}];
let unitIndex=0,i=0,answers={};
const home=document.getElementById('home'),test=document.getElementById('test'),unitsBox=document.getElementById('units');
units.forEach((u,k)=>{
 const b=document.createElement('button');b.className='unit';
 b.innerHTML='<b>'+u.title+'</b><span>50 سؤالًا • ابدأ الاختبار</span>';
 b.onclick=()=>start(k);unitsBox.appendChild(b);
});
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function start(k){unitIndex=k;i=0;answers={};home.classList.add('hidden');test.classList.remove('hidden');render()}
function render(){
 const u=units[unitIndex],x=u.questions[i];
 const opts=x.opts.map((o,j)=>{let v=String.fromCharCode(65+j);return '<label class="option"><input type="radio" name="ans" value="'+v+'" '+(answers[x.n]===v?'checked':'')+'> <b>'+v+'.</b> '+esc(o)+'</label>'}).join('');
 test.innerHTML='<div class="card"><div class="top"><b>'+esc(u.title)+'</b><button class="back" onclick="goHome()">الوحدات</button></div>'+
 '<div class="progress"><div class="bar" style="width:'+(i/50*100)+'%"></div></div>'+
 '<div class="qnum">السؤال '+(i+1)+' من 50</div><div class="question">'+esc(x.q)+'</div>'+opts+
 '<div class="actions">'+(i>0?'<button class="back" onclick="prev()">السابق</button>':'')+
 '<button onclick="next()">'+(i===49?'إنهاء الاختبار':'التالي')+'</button></div></div>';
 window.scrollTo({top:0,behavior:'smooth'});
}
function next(){let s=document.querySelector('input[name=ans]:checked');if(!s){alert('اختر إجابة أولاً');return}answers[units[unitIndex].questions[i].n]=s.value;if(i<49){i++;render()}else finish()}
function prev(){let s=document.querySelector('input[name=ans]:checked');if(s)answers[units[unitIndex].questions[i].n]=s.value;i--;render()}
function finish(){
 const qs=units[unitIndex].questions;let score=qs.reduce((n,x)=>n+(answers[x.n]===x.answer?1:0),0);
 test.innerHTML='<div class="card center"><h1>نتيجتك</h1><div class="score">'+score+' / 50</div><div style="font-size:20px">'+Math.round(score/50*100)+'%</div>'+
 '<div class="actions" style="justify-content:center"><button onclick="review()">مراجعة الإجابات</button><button class="back" onclick="start('+unitIndex+')">إعادة الاختبار</button><button class="back" onclick="goHome()">اختيار وحدة أخرى</button></div></div>';
 window.scrollTo({top:0,behavior:'smooth'});
}
function review(){
 const qs=units[unitIndex].questions;
 test.innerHTML='<div class="card"><div class="top"><h2>مراجعة الإجابات</h2><button class="back" onclick="goHome()">الوحدات</button></div>'+
 qs.map((x,k)=>{let ok=answers[x.n]===x.answer;return '<div class="review"><b>س'+(k+1)+'. '+esc(x.q)+'</b><br>إجابتك: <span class="'+(ok?'correct':'wrong')+'">'+(answers[x.n]||'بدون إجابة')+'</span><br>الإجابة الصحيحة: <span class="correct">'+x.answer+'</span></div>'}).join('')+
 '<div class="actions"><button onclick="start('+unitIndex+')">إعادة الاختبار</button></div></div>';
 window.scrollTo({top:0,behavior:'smooth'});
}
function goHome(){test.classList.add('hidden');home.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
</script>
</body></html>
